services:
  server:
    image: ghcr.io/reesemclean/musicbox/server:latest
    container_name: musicbox-server
    network_mode: host
    volumes:
      # Persist database (contains all data including songs as BLOBs)
      - data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/musicbox.db
      - SERVER_URL=https://musicbox.mc-home.org
      - MUSICBOX_PASSWORD=musicbox
      - PORT=8347
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8347/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  data:
