# MusicBox MQTT Broker Configuration
# Eclipse Mosquitto

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Regular MQTT listener
listener 1883
allow_anonymous true

# WebSocket listener for browser clients
listener 9001
protocol websockets
allow_anonymous true
