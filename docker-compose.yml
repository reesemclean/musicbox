# ============================================================================
# MusicBox Docker Compose (Production)
#
# For use with Portainer or any Docker host.
# Image is pre-built and pulled from ghcr.io.
# Firmware is embedded in the image (generic — no baked-in network config).
# Devices self-provision via captive portal on first boot.
#
# Required env vars:
#   DEVICE_MQTT_HOST  — LAN-reachable MQTT broker address for ESP32 devices
#
# Usage:
#   DEVICE_MQTT_HOST=mqtt.example.com docker compose up -d
#
# This will start:
#   - MusicBox (port 3000) - Web UI + API + embedded firmware for OTA
#   - MQTT Broker (port 1883 + 9001 for WebSocket)
#
# Data is persisted in Docker volumes.
# ============================================================================

services:
  musicbox:
    image: ghcr.io/reesemclean/musicbox:dev
    ports:
      - "${MUSICBOX_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/data/musicbox.db
      - DATA_DIR=/data
      - MQTT_BROKER_URL=mqtt://mqtt:1883
      - API_BASE_URL=${API_BASE_URL:-http://musicbox:3000}
      - VITE_MQTT_WS_URL=${VITE_MQTT_WS_URL:-ws://localhost:9001}
      - DEVICE_MQTT_HOST=${DEVICE_MQTT_HOST:-localhost}
      - DEVICE_MQTT_PORT=${DEVICE_MQTT_PORT:-1883}
    volumes:
      - musicbox_data:/data
    depends_on:
      mqtt:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883" # MQTT protocol
      - "9001:9001" # WebSocket for browser clients
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      - mosquitto_config:/mosquitto/config
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
    restart: unless-stopped

configs:
  mosquitto_conf:
    content: |
      persistence true
      persistence_location /mosquitto/data/
      log_dest stdout
      log_type error
      log_type warning
      log_type notice
      log_type information
      listener 1883
      allow_anonymous true
      listener 9001
      protocol websockets
      allow_anonymous true

volumes:
  musicbox_data:
    name: musicbox_data
  mosquitto_data:
    name: mosquitto_data
  mosquitto_logs:
    name: mosquitto_logs
  mosquitto_config:
    name: mosquitto_config
