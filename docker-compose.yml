services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Persist database
      - musicbox-data:/app/data
      # Mount library folder
      - ./packages/server/library:/app/library:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/musicbox.db
      - SERVER_URL=http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  musicbox-data:
