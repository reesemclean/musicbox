# ============================================================================
# MusicBox Docker Compose (Production)
#
# For use with Portainer or any Docker host.
# Both images are pre-built and pulled from ghcr.io.
# The firmware-builder compiles ESP32 firmware at deploy time using your
# network-specific env vars (WIFI_SSID, API_BASE_URL, etc.).
#
# Usage:
#   WIFI_SSID=xxx WIFI_PASS=yyy docker compose up -d
#
# This will start:
#   - Firmware Builder (one-shot: compiles firmware with your config, then exits)
#   - MusicBox (port 3000) - Web UI + API (serves firmware for OTA)
#   - MQTT Broker (port 1883 + 9001 for WebSocket)
#
# Data is persisted in Docker volumes.
# ============================================================================

services:
  firmware-builder:
    image: ghcr.io/reesemclean/musicbox-firmware-builder:latest
    environment:
      - WIFI_SSID=${WIFI_SSID}
      - WIFI_PASS=${WIFI_PASS}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mqtt}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - API_BASE_URL=${API_BASE_URL:-http://musicbox:3000}
      - FIRMWARE_VERSION=${FIRMWARE_VERSION:-latest}
    volumes:
      - firmware_data:/firmware

  musicbox:
    image: ghcr.io/reesemclean/musicbox:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/data/musicbox.db
      - DATA_DIR=/data
      - MQTT_BROKER_URL=mqtt://mqtt:1883
      - API_BASE_URL=http://musicbox:3000
      - VITE_MQTT_WS_URL=ws://localhost:9001
    volumes:
      - musicbox_data:/data
      - firmware_data:/app/firmware:ro
    depends_on:
      firmware-builder:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"   # MQTT protocol
      - "9001:9001"   # WebSocket for browser clients
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      - mosquitto_config:/mosquitto/config
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
    restart: unless-stopped

configs:
  mosquitto_conf:
    content: |
      persistence true
      persistence_location /mosquitto/data/
      log_dest stdout
      log_type error
      log_type warning
      log_type notice
      log_type information
      listener 1883
      allow_anonymous true
      listener 9001
      protocol websockets
      allow_anonymous true

volumes:
  firmware_data:
    name: musicbox_firmware
  musicbox_data:
    name: musicbox_data
  mosquitto_data:
    name: mosquitto_data
  mosquitto_logs:
    name: mosquitto_logs
  mosquitto_config:
    name: mosquitto_config
