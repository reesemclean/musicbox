# Mosquitto configuration for MusicBox development
#
# Mirrors the listeners in the root mosquitto.conf (used by Docker Compose)
# but without persistence, so it can run from a checkout with no state
# directory to create.

# Devices and the server
listener 1883

# Browsers. The control-plane UI subscribes over MQTT-over-WebSocket for live
# playback status and device logs; without this listener the UI still works
# and commands still reach devices, but those panels never update.
listener 9001
protocol websockets

# Allow anonymous connections (for local dev)
allow_anonymous true

# Logging
log_dest stdout
log_type all
