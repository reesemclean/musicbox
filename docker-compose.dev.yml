# ============================================================================
# MusicBox Docker Compose - Local Development
#
# Builds from source instead of pulling images.
#
# Usage:
#   WIFI_SSID=xxx WIFI_PASS=yyy docker compose -f docker-compose.dev.yml up --build
# ============================================================================

services:
  firmware-builder:
    build:
      context: .
      dockerfile: Dockerfile.firmware
    environment:
      - WIFI_SSID=${WIFI_SSID}
      - WIFI_PASS=${WIFI_PASS}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mqtt}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - API_HOST=${API_HOST:-musicbox}
      - API_PORT=${API_PORT:-3000}
      - FIRMWARE_VERSION=${FIRMWARE_VERSION:-dev}
    volumes:
      - firmware_data:/firmware

  musicbox:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/data/musicbox.db
      - DATA_DIR=/data
      - MQTT_BROKER_URL=mqtt://mqtt:1883
      - API_BASE_URL=http://musicbox:3000
      - VITE_MQTT_WS_URL=ws://localhost:9001
    volumes:
      - musicbox_data:/data
      - firmware_data:/app/firmware:ro
    depends_on:
      firmware-builder:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

volumes:
  firmware_data:
  musicbox_data:
  mosquitto_data:
  mosquitto_logs:
