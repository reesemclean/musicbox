# ============================================================================
# MusicBox Docker Compose - Local Development
#
# Builds from source instead of pulling images.
# Firmware is built as part of the main image (no separate firmware-builder).
#
# Usage:
#   DEVICE_MQTT_HOST=192.168.1.100 docker compose -f docker-compose.dev.yml up --build
# ============================================================================

services:
  musicbox:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/data/musicbox.db
      - DATA_DIR=/data
      - MQTT_BROKER_URL=mqtt://mqtt:1883
      - API_BASE_URL=http://musicbox:3000
      - VITE_MQTT_WS_URL=ws://localhost:9001
      - DEVICE_MQTT_HOST=${DEVICE_MQTT_HOST:-localhost}
      - DEVICE_MQTT_PORT=${DEVICE_MQTT_PORT:-1883}
    volumes:
      - musicbox_data:/data
    depends_on:
      mqtt:
        condition: service_started
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

volumes:
  musicbox_data:
  mosquitto_data:
  mosquitto_logs:
