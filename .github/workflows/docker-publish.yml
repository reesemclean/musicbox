name: Build and Publish Docker Images (Manual)

# NOTE: For production releases, use git tags instead:
#   git tag v1.0.0 && git push origin v1.0.0
# This triggers the release.yml workflow which builds the images and creates a release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., dev, test)'
        required: true
        default: 'dev'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Web app image
      - name: Extract metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }}
            type=sha,prefix=

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      # Firmware builder image
      - name: Extract metadata (firmware-builder)
        id: meta-firmware
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-firmware-builder
          tags: |
            type=raw,value=${{ github.event.inputs.tag }}
            type=sha,prefix=

      - name: Build and push firmware-builder image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.firmware
          push: true
          tags: ${{ steps.meta-firmware.outputs.tags }}
          labels: ${{ steps.meta-firmware.outputs.labels }}
