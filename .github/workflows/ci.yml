name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Node.js projects (server, shared)
  node:
    name: Node.js
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint all projects
        run: npm run lint

      - name: Typecheck all projects
        run: npm run typecheck

      - name: Build all projects
        run: npm run build

  # Go player
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/player-go

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: packages/player-go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'gofmt -w .'"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: packages/player-go

      - name: Run tests
        run: go test -v ./...

      - name: Build
        run: go build -o dist/musicbox-player ./cmd/player

      - name: Build for ARM64
        run: GOOS=linux GOARCH=arm64 go build -o dist/musicbox-player-arm64 ./cmd/player
