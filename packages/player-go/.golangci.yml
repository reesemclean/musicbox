# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Default linters (enabled by default, listed explicitly)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional linters
    - bodyclose      # Check HTTP response bodies are closed
    - gocritic       # Opinionated linter
    - gosec          # Security checks
    - misspell       # Catch common typos
    - unconvert      # Remove unnecessary conversions
    - unparam        # Find unused parameters
    - whitespace     # Check trailing whitespace

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment  # Not worth the noise

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam       # Not critical for this project
        - rangeValCopy    # Sometimes intentional

    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*net.UnixConn).Close
        - os.Remove
        - (periph.io/x/conn/v3/i2c.BusCloser).Close

    gosec:
      excludes:
        - G104  # Unhandled errors
        - G204  # Subprocess with variable
        - G301  # Directory permissions
        - G304  # File path from variable

    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 50

  # Maximum count of issues with the same text
  max-same-issues: 10

  exclude-rules:
    # Exclude some linters from running on tests
    - path: _test\.go
      linters:
        - gosec
        - unparam

    # Ignore some errors in main.go (startup code)
    - path: cmd/player/main.go
      linters:
        - gocritic
      text: "exitAfterDefer"
