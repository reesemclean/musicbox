# MusicBox ALSA Configuration
# MAX98357A I2S DAC with dmix for mixing multiple audio sources

# Hardware dmix - allows multiple apps to share the audio device
pcm.dmixer {
  type dmix
  ipc_key 1024
  ipc_perm 0666
  slave {
    pcm "hw:0,0"
    period_time 0
    period_size 1024
    buffer_size 4096
    rate 44100
  }
}

# Software volume control on top of dmix
pcm.softvol {
  type softvol
  slave.pcm "dmixer"
  control {
    name "Master"
    card 0
  }
  min_dB -51.0
  max_dB 0.0
}

# Default output - goes through softvol and dmix
pcm.!default {
  type plug
  slave.pcm "softvol"
}

# Default control device
ctl.!default {
  type hw
  card 0
}
