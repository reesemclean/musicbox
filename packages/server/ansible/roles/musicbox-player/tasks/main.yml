---
# MusicBox Player Role
# Deploys the MusicBox player Go binary via direct copy

- name: Check if player version file exists
  ansible.builtin.stat:
    path: /opt/musicbox/player/version.txt
  register: player_version_file

- name: Read current player version
  ansible.builtin.slurp:
    src: /opt/musicbox/player/version.txt
  register: current_version_content
  when: player_version_file.stat.exists

- name: Set current player version fact
  ansible.builtin.set_fact:
    current_player_version: "{{ (current_version_content.content | b64decode | trim) if player_version_file.stat.exists else 'none' }}"

- name: Display version information
  ansible.builtin.debug:
    msg: 'Current: {{ current_player_version }}, Desired: {{ player_version }}'

- name: Stop player service before update
  ansible.builtin.systemd:
    name: musicbox-player
    state: stopped
  become: yes
  when: current_player_version != player_version
  ignore_errors: yes

- name: Create player directory
  ansible.builtin.file:
    path: /opt/musicbox/player
    state: directory
    owner: musicbox
    group: musicbox
    mode: '0755'
  become: yes

- name: Install player binary
  ansible.builtin.copy:
    src: /app/player-bundle/musicbox-player
    dest: /opt/musicbox/player/musicbox-player
    owner: musicbox
    group: musicbox
    mode: '0755'
  become: yes
  when: current_player_version != player_version
  notify: Restart player service

- name: Write version file
  ansible.builtin.copy:
    content: '{{ player_version }}'
    dest: /opt/musicbox/player/version.txt
    owner: musicbox
    group: musicbox
    mode: '0644'
  become: yes
  when: current_player_version != player_version

- name: Install hwtest binary to PATH
  ansible.builtin.copy:
    src: /app/player-bundle/musicbox-hwtest
    dest: /usr/local/bin/musicbox-hwtest
    owner: root
    group: root
    mode: '0755'
  become: yes
  when: current_player_version != player_version

- name: Save device secret to config
  ansible.builtin.copy:
    content: '{{ device_secret }}'
    dest: /boot/firmware/musicbox/device.txt
    mode: '0600'
  become: yes

- name: Save server URL to config
  ansible.builtin.lineinfile:
    path: /boot/firmware/musicbox/config.txt
    regexp: '^SERVER_URL='
    line: 'SERVER_URL={{ server_url }}'
    create: yes
    mode: '0644'
  become: yes

- name: Deploy systemd service file
  ansible.builtin.template:
    src: musicbox-player.service.j2
    dest: /etc/systemd/system/musicbox-player.service
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify:
    - Reload systemd
    - Restart player service

- name: Enable player service
  ansible.builtin.systemd:
    name: musicbox-player
    enabled: yes
    daemon_reload: yes
  become: yes

- name: Ensure player service is running
  ansible.builtin.systemd:
    name: musicbox-player
    state: started
  become: yes
