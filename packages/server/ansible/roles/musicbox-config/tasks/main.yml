---
# MusicBox Config Role
# Deploys boot config and audio configuration

- name: Deploy boot config.txt
  ansible.builtin.template:
    src: boot-config.txt.j2
    dest: /boot/firmware/config.txt
    owner: root
    group: root
    mode: '0755'
  become: yes
  register: boot_config

- name: Deploy ALSA configuration
  ansible.builtin.template:
    src: asound.conf.j2
    dest: /etc/asound.conf
    owner: root
    group: root
    mode: '0644'
  become: yes
  register: alsa_config

- name: Set hostname based on device name
  ansible.builtin.hostname:
    name: '{{ inventory_hostname }}'
  become: yes
  register: hostname_changed

- name: Update /etc/hosts with new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: '127.0.1.1       {{ inventory_hostname }}'
    state: present
  become: yes
  when: hostname_changed.changed

- name: Set timezone
  ansible.builtin.timezone:
    name: "{{ timezone | default('America/New_York') }}"
  become: yes

- name: Enable I2C module
  ansible.builtin.lineinfile:
    path: /etc/modules
    line: 'i2c-dev'
    create: yes
    state: present
  become: yes

- name: Schedule reboot if boot config changed
  ansible.builtin.set_fact:
    reboot_required: true
  when: boot_config.changed

- name: Reboot if required
  ansible.builtin.reboot:
    reboot_timeout: 300
    msg: 'Rebooting for boot config changes'
  become: yes
  when: reboot_required | default(false)
